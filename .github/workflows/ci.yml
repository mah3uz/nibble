name: CI

on:
  workflow_dispatch: # manually disabled — remove this line and restore the triggers below to re-enable
  # pull_request:
  # push:
  #   branches: [main]

jobs:
  scan_ruby:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Scan for common Rails security vulnerabilities using static analysis
        run: bin/brakeman --no-pager

      - name: Scan for known security vulnerabilities in gems used
        run: bin/bundler-audit

  lint:
    runs-on: ubuntu-latest
    env:
      RUBOCOP_CACHE_ROOT: tmp/rubocop
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Prepare RuboCop cache
        uses: actions/cache@v6
        env:
          DEPENDENCIES_HASH: ${{ hashFiles('.ruby-version', '**/.rubocop.yml', '**/.rubocop_todo.yml', 'Gemfile.lock') }}
        with:
          path: ${{ env.RUBOCOP_CACHE_ROOT }}
          key: rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-${{ github.ref_name == github.event.repository.default_branch && github.run_id || 'default' }}
          restore-keys: |
            rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-

      - name: Lint code for consistent style
        run: bin/rubocop -f github

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Node (and Ruby, needed by vite-plugin-ruby) at the versions pinned in mise.toml
      - name: Set up toolchain
        uses: jdx/mise-action@v4
        with:
          cache: true

      - name: Install Ruby gems
        run: bundle install --jobs 4

      - name: Install npm packages
        run: npm ci

      - name: Lint Vue/TypeScript
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Type check
        run: npm run check

      - name: Frontend unit tests
        run: npm run test:js

      - name: Build client and SSR bundles
        env:
          RAILS_ENV: production
          SECRET_KEY_BASE_DUMMY: 1
        run: bin/vite build && bin/vite build --ssr

      - name: SSR smoke test
        run: bin/ssr-smoke

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libvips

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up toolchain
        uses: jdx/mise-action@v4
        with:
          cache: true

      - name: Install Ruby gems
        run: bundle install --jobs 4

      # Test requests render the layout, which builds Vite assets on demand (autoBuild).
      - name: Install npm packages
        run: npm ci

      # Build once up front so no test triggers (and races) an on-demand Vite build.
      - name: Build test assets
        env:
          RAILS_ENV: test
        run: bin/vite build

      - name: Run tests
        env:
          RAILS_ENV: test
        run: bin/rails db:test:prepare test
