schema: 1
title: Doc
tabs:
  main:
    sections:
      - fields:
          - handle: title
            field: { type: text, required: true }
          - handle: description
            field: { type: text }
          - handle: rank
            field: { type: integer }
          - handle: body
            field: { type: markdown }
          - handle: links
            field:
              type: grid
              fields:
                - handle: label
                  field: { type: text }
