<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Nibble — a schema-driven CMS">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1e1b4b"/>
      <stop offset=".55" stop-color="#2e1065"/>
      <stop offset="1" stop-color="#312e81"/>
    </linearGradient>
    <radialGradient id="glow" cx="170" cy="150" r="260" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#a855f7" stop-opacity=".45"/>
      <stop offset="1" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rule" x1="280" y1="0" x2="1010" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f472b6"/>
      <stop offset=".5" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="body" x1="4" y1="4" x2="28" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f472b6"/>
      <stop offset=".5" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="4" x2="0" y2="18" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity=".35"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="bite">
      <rect width="32" height="32" fill="#fff"/>
      <circle cx="22.2" cy="3.2" r="3.8" fill="#000"/>
      <circle cx="26.8" cy="5.6" r="4" fill="#000"/>
      <circle cx="29.8" cy="10.2" r="3.8" fill="#000"/>
    </mask>
  </defs>

  <rect width="1200" height="300" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="24" fill="url(#glow)"/>

  <g transform="translate(88 78) scale(4.5)">
    <g mask="url(#bite)">
      <rect x="2.5" y="3.5" width="26.5" height="26" rx="8.5" fill="url(#body)"/>
      <rect x="2.5" y="3.5" width="26.5" height="26" rx="8.5" fill="url(#gloss)"/>
    </g>
    <ellipse cx="11.2" cy="15.4" rx="2.9" ry="3.3" fill="#fff"/>
    <ellipse cx="18.6" cy="15.4" rx="2.9" ry="3.3" fill="#fff"/>
    <circle cx="12.1" cy="14.6" r="1.55" fill="#1e1b4b"/>
    <circle cx="19.5" cy="14.6" r="1.55" fill="#1e1b4b"/>
    <circle cx="12.6" cy="14" r=".5" fill="#fff"/>
    <circle cx="20" cy="14" r=".5" fill="#fff"/>
    <circle cx="7.6" cy="20.4" r="1.7" fill="#fbcfe8" opacity=".6"/>
    <circle cx="22.4" cy="20.4" r="1.7" fill="#fbcfe8" opacity=".6"/>
    <ellipse cx="15" cy="22.6" rx="1.7" ry="2" fill="#1e1b4b"/>
    <ellipse cx="15" cy="23.5" rx="1" ry=".7" fill="#f472b6"/>
    <rect x="26.2" y="0.6" width="2.2" height="2.2" rx=".6" fill="#f9a8d4" transform="rotate(24 27.3 1.7)"/>
    <rect x="29.4" y="14.2" width="1.8" height="1.8" rx=".5" fill="#818cf8" transform="rotate(-18 30.3 15.1)"/>
    <circle cx="30.8" cy="3.4" r=".8" fill="#c084fc"/>
  </g>

  <g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
    <text x="320" y="158" font-size="92" font-weight="700" letter-spacing="-3" fill="#ffffff">Nibble</text>
    <rect x="322" y="180" width="690" height="3" rx="1.5" fill="url(#rule)"/>
    <text x="322" y="228" font-size="27" font-weight="500" letter-spacing=".2" fill="#c7d2fe">A schema-driven CMS. Rails 8, Inertia + Vue 3 with SSR, SQLite.</text>
  </g>
</svg>
