schema: 1
title: Integrations
blueprint:
  title: Integrations
  tabs:
    analytics:
      display: Analytics
      sections:
        - instructions: "Loaded on the live site only: not in previews, the Control Plane, or while indexing is blocked. You can run several tools at once."
          fields:
            - handle: analytics
              field:
                type: replicator
                display: Analytics
                hide_display: true
                button_label: Add analytics
                tab_count: true
                sets:
                  private:
                    display: Privacy-friendly, no cookies
                    sets:
                      plausible:
                        display: Plausible
                        icon: chart
                        badge: No cookies
                        instructions: Simple, privacy-friendly analytics, hosted or self-hosted.
                        fields:
                          - handle: script_url
                            field:
                              type: text
                              input_type: url
                              display: Script URL
                              required: true
                              placeholder: https://plausible.io/js/pa-XXXXXXXX.js
                              instructions: "The src of the script in Plausible → Site settings → Site installation. [Plausible's guide](https://plausible.io/docs/plausible-script)"
                              validate: ["analytics_id:script_url"]
                          - handle: domain
                            field:
                              type: text
                              display: Domain
                              required: true
                              placeholder: example.com
                              instructions: The older script.js needs the site's domain as Plausible knows it.
                              validate: ["analytics_id:domain"]
                              if: { script_url: "contains /script." }
                          - handle: tags
                            field: { type: analytics_tags, display: What Nibble writes, replicator_preview: false }
                      fathom:
                        display: Fathom
                        icon: chart
                        badge: No cookies
                        instructions: Privacy-first analytics from a Canadian company.
                        fields:
                          - handle: site_id
                            field: { type: text, display: Site ID, required: true, placeholder: ABCDEFGH, instructions: "Fathom → Settings → Sites → Embed code. [Fathom's guide](https://usefathom.com/docs/script/embed)", validate: ["analytics_id:fathom"] }
                          - handle: tags
                            field: { type: analytics_tags, display: What Nibble writes, replicator_preview: false }
                      umami:
                        display: Umami
                        icon: chart
                        badge: No cookies
                        instructions: Open-source analytics, Umami Cloud or self-hosted.
                        fields:
                          - handle: website_id
                            field: { type: text, display: Website ID, required: true, placeholder: 94db1cb1-74f4-4a40-ad6c-962362670409, instructions: "Umami → Settings → Websites → Edit → Website ID. [Umami's guide](https://docs.umami.is/docs/tracker-configuration)", validate: ["analytics_id:umami"] }
                          - handle: script_url
                            field: { type: text, input_type: url, display: Script URL, placeholder: https://cloud.umami.is/script.js, instructions: Only for a self-hosted Umami; Umami Cloud's is used when empty., validate: ["analytics_id:script_url"] }
                          - handle: tags
                            field: { type: analytics_tags, display: What Nibble writes, replicator_preview: false }
                      cloudflare:
                        display: Cloudflare Web Analytics
                        icon: chart
                        badge: No cookies
                        max: 1
                        instructions: Free analytics from Cloudflare, for any site. One per page.
                        fields:
                          - handle: token
                            field: { type: text, display: Token, required: true, instructions: "Cloudflare → Analytics & Logs → Web Analytics → Manage site: the token in the JS snippet. [Cloudflare's guide](https://developers.cloudflare.com/web-analytics/get-started/)", validate: ["analytics_id:cloudflare"] }
                          - handle: tags
                            field: { type: analytics_tags, display: What Nibble writes, replicator_preview: false }
                  consent:
                    display: Sets cookies, needs consent in the EU and UK
                    sets:
                      ga4:
                        display: Google Analytics 4
                        icon: chart
                        badge: Needs consent
                        instructions: Google's analytics. Several measurement IDs share one loader.
                        fields:
                          - handle: measurement_id
                            field: { type: text, display: Measurement ID, required: true, placeholder: G-XXXXXXXXXX, instructions: "Google Analytics → Admin → Data streams → your web stream. [Google's guide](https://developers.google.com/tag-platform/gtagjs/install)", validate: ["analytics_id:ga4"] }
                          - handle: tags
                            field: { type: analytics_tags, display: What Nibble writes, replicator_preview: false }
                      gtm:
                        display: Google Tag Manager
                        icon: chart
                        badge: Needs consent
                        instructions: Loads the tags you manage in Google Tag Manager.
                        fields:
                          - handle: container_id
                            field: { type: text, display: Container ID, required: true, placeholder: GTM-XXXXXXX, instructions: "Tag Manager → Workspace; the ID beside the container's name. [Google's guide](https://developers.google.com/tag-platform/tag-manager/web)", validate: ["analytics_id:gtm"] }
                          - handle: tags
                            field: { type: analytics_tags, display: What Nibble writes, replicator_preview: false }
                  other:
                    display: Other
                    sets:
                      script:
                        display: Script tag
                        icon: code-block
                        instructions: Any tool that loads from one script tag with data- attributes.
                        fields:
                          - handle: script_url
                            field: { type: text, input_type: url, display: Script URL, required: true, placeholder: https://example.com/script.js, validate: ["analytics_id:script_url"] }
                          - handle: attributes
                            field:
                              type: grid
                              mode: table
                              display: Script attributes
                              instructions: For example data-domain, data-site or data-website-id.
                              add_row: Add attribute
                              fields:
                                - handle: name
                                  field: { type: text, required: true, validate: ["regex:/\\Adata-[a-z0-9-]+\\z/"] }
                                - handle: value
                                  field: { type: text, required: true }
                          - handle: tags
                            field: { type: analytics_tags, display: What Nibble writes, replicator_preview: false }
    code:
      display: Custom code
      sections:
        - instructions: Added to every live page exactly as written. Only paste code from sources you trust.
          fields:
            - handle: custom_code
              field:
                type: replicator
                display: Custom code
                hide_display: true
                button_label: Add snippet
                tab_count: true
                sets:
                  snippet:
                    display: Snippet
                    icon: code-block
                    fields:
                      - handle: name
                        field: { type: text, display: Name, required: true, placeholder: Chat widget, width: 50 }
                      - handle: placement
                        field:
                          type: select
                          display: Where
                          required: true
                          default: head
                          options: { head: In the head, body_start: At the start of the body, body_end: At the end of the body }
                          width: 50
                      - handle: code
                        field: { type: textarea, display: Code, required: true, monospace: true, rows: 8, replicator_preview: false }
    captcha:
      display: CAPTCHA
      sections:
        - display: CAPTCHA
          instructions: Used by forms that turn CAPTCHA on.
          fields:
            - handle: captcha_provider
              field: { type: select, display: Provider, clearable: true, options: { turnstile: Cloudflare Turnstile, recaptcha: Google reCAPTCHA v3 }, width: 50 }
            - handle: captcha_site_key
              field: { type: text, display: Site key, width: 50 }
            - handle: captcha_secret_key
              field: { type: secret, display: Secret key }
            - handle: recaptcha_min_score
              field:
                type: text
                input_type: number
                display: Minimum score
                instructions: reCAPTCHA v3 rates each visitor from 0.0 (likely a bot) to 1.0 (likely human). Submissions below this score are rejected.
                default: 0.5
                placeholder: "0.5"
                validate: ["regex:/\\A(0(\\.\\d+)?|1(\\.0+)?)\\z/"]
                if: { captcha_provider: "recaptcha" }
                width: 50
    email:
      display: Email
      sections:
        - display: Sender
          instructions: Every email the site sends comes from this address, including form notifications and account invites.
          fields:
            - handle: mail_from_name
              field: { type: text, display: Sender name, placeholder: Nibble, width: 50 }
            - handle: mail_from_address
              field: { type: text, input_type: email, display: Sender address, placeholder: noreply@example.com, width: 50 }
